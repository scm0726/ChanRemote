<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ChanRemote (C#)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "Segoe UI", sans-serif; }
    #view { position: fixed; inset: 0; touch-action: none; }
    #cv { position: absolute; left: 0; top: 0; }
    #chip { position: absolute; top: 6px; left: 6px; z-index: 5; font-size: 12px; color: #9be7b4;
      background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 999px; pointer-events: none; }
    #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #cfd6e4; font-size: 15px; text-align: center; padding: 20px; z-index: 6; }
  </style>
</head>
<body>
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="chip" hidden></div>
    <div id="msg">PC에 연결하는 중…</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
