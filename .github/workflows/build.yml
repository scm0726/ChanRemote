name: 빌드 (PC 설치파일 + 안드로이드 앱)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 안드로이드 SDK 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - run: bash android-app/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-app/ChanRemote.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: ChanRemote 1.2.${{ github.run_number }}
          make_latest: true
          body: |
            - PC: ChanRemote-*.exe 를 받아 더블클릭하면 바로 실행돼요 (설치 불필요).
            - 폰(폴드8): ChanRemote.apk 를 받아 설치하세요.
          files: |
            out/windows/*.exe
            out/android/ChanRemote.apk
